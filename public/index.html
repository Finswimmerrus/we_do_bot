<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вместе — задачи пары</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <span class="wordmark"><span class="mark" aria-hidden="true">✓</span> Вместе</span>
      <button id="settings" class="quiet" type="button" hidden>Пространство</button>
    </header>
    <p id="notice" role="status" hidden></p>
    <section id="entry" aria-live="polite"><p>Загружаем задачи…</p></section>
    <div id="workspace" hidden>
      <nav aria-label="Разделы" class="tabs">
        <button type="button" data-view="backlog">Бэклог</button>
        <button type="button" data-view="periods">Периоды</button>
        <button type="button" data-view="statistics">Статистика</button>
      </nav>
      <section id="list-view">
        <div class="heading">
          <h1 id="view-title">Бэклог</h1>
          <button id="review-start" type="button" hidden>Разобрать</button>
        </div>
        <form id="quick-add" class="quick-add">
          <input id="new-title" placeholder="Новая задача" aria-label="Название новой задачи" maxlength="200" required>
          <button class="primary" type="submit">Добавить</button>
        </form>
        <div class="filters">
          <label id="period-mode-label" hidden>Период
            <select id="period-mode"><option value="month">Месяц</option><option value="year">Год</option></select>
          </label>
          <label id="backlog-scope-label">Период
            <select id="backlog-scope"><option value="all">Все месяцы</option><option value="none">Без месяца</option><option value="month">Выбрать месяц</option></select>
          </label>
          <label id="scope-month-label" hidden>Месяц
            <input id="scope-month" type="month" placeholder="ГГГГ-ММ" pattern="[1-9][0-9]{3}-(0[1-9]|1[0-2])">
          </label>
          <label id="scope-year-label" hidden>Год
            <input id="scope-year" type="number" min="1000" max="9999">
          </label>
          <label data-task-filter>Статус
            <select id="filter-status"><option value="active">Активные</option><option value="done">Выполненные</option><option value="obsolete">Неактуальные</option><option value="all">Все статусы</option></select>
          </label>
          <label data-task-filter>Поиск<input id="filter-query" type="search" placeholder="Название"></label>
          <label data-task-filter>Категория<select id="filter-category"><option value="">Все</option></select></label>
          <label data-task-filter>Важность
            <select id="filter-importance">
              <option value="">Любая</option><option value="low">Низкая</option>
              <option value="medium">Средняя</option><option value="high">Важная</option>
              <option value="global">Глобальная</option>
            </select>
          </label>
        </div>
        <div id="stats" class="stats" hidden></div>
        <div id="year-grid" class="year-grid" hidden></div>
        <p id="list-empty" class="empty" hidden></p>
        <div id="task-list" class="task-list" aria-live="polite"></div>
      </section>
      <section id="task-view" hidden>
        <button id="task-back" class="quiet back" type="button">‹ К списку</button>
        <h1 id="task-heading">Задача</h1>
        <p id="task-details"></p>
        <div class="task-status">
          <span id="task-priority"></span>
          <span id="task-status-label" class="status-label" hidden></span>
          <div id="task-status-actions" class="task-status-actions"></div>
        </div>
        <form id="task-editor" class="card editor">
          <label class="wide">Название<input id="edit-title" maxlength="200" required></label>
          <label>Месяц<input id="edit-period" type="month" placeholder="ГГГГ-ММ" pattern="[1-9][0-9]{3}-(0[1-9]|1[0-2])"></label>
          <label>Категория<select id="edit-category"></select></label>
          <label id="new-category-field" class="wide" hidden>Название новой категории
            <input id="new-category" maxlength="60" required disabled>
          </label>
          <label>Важность
            <select id="edit-importance" required>
              <option value="" disabled>Выберите важность</option>
              <option value="low">Низкая</option><option value="medium">Средняя</option>
              <option value="high">Важная</option><option value="global">Глобальная</option>
            </select>
          </label>
          <label class="wide">Родитель<select id="edit-parent"></select></label>
          <div class="wide actions"><button class="primary" type="submit">Сохранить</button></div>
        </form>
        <div id="subtask-tools" class="actions" hidden>
          <button id="detach-subtask" type="button">Сделать самостоятельной</button>
          <button id="delete-subtask" class="danger" type="button">Удалить подзадачу</button>
        </div>
        <div id="subtasks">
          <h2>Подзадачи</h2>
          <p id="subtask-progress"></p>
          <div id="child-list" class="task-list"></div>
          <form id="add-child">
            <div class="quick-add">
              <input id="child-title" placeholder="Новая подзадача" aria-label="Название подзадачи" maxlength="200" required>
              <button type="submit">Добавить</button>
            </div>
            <details id="child-options" class="child-options">
              <summary>Параметры подзадачи</summary>
              <div class="editor">
                <label>Категория подзадачи<select id="child-category"></select></label>
                <label>Месяц подзадачи<input id="child-period" type="month" placeholder="ГГГГ-ММ" pattern="[1-9][0-9]{3}-(0[1-9]|1[0-2])"></label>
                <label id="child-category-new-field" class="wide" hidden>Название новой категории
                  <input id="child-category-new" maxlength="60" required disabled>
                </label>
              </div>
            </details>
          </form>
        </div>
      </section>
      <section id="review-view" hidden>
        <button id="review-back" class="quiet back" type="button">‹ К статистике</button>
        <h1 id="review-heading">Разбор</h1>
        <p id="review-progress"></p>
        <div id="review-card" class="card" hidden>
          <h2 id="review-task-title"></h2>
          <p id="review-task-info"></p>
          <div class="actions">
            <button data-review="move" type="button">Перенести</button>
            <button class="icon-button" data-review="done" type="button" aria-label="Завершить" title="Завершить">
              <span class="action-icon icon-check" aria-hidden="true"></span>
            </button>
            <button class="icon-button" data-review="obsolete" type="button" aria-label="Отменить задачу" title="Отменить задачу">
              <span class="action-icon icon-trash" aria-hidden="true"><i></i></span>
            </button>
            <button class="quiet" data-review="skip" type="button">Оставить</button>
          </div>
          <form id="review-move" class="quick-add" hidden>
            <input id="review-month" type="month" aria-label="Новый месяц" placeholder="ГГГГ-ММ" pattern="[1-9][0-9]{3}-(0[1-9]|1[0-2])" required>
            <button class="primary" type="submit">Перенести</button>
            <button id="review-clear" type="button">Убрать месяц</button>
          </form>
        </div>
      </section>
      <section id="settings-view" hidden>
        <button id="settings-back" class="quiet back" type="button">‹ Назад</button>
        <h1>Пространство пары</h1>
        <button id="open-labels" class="settings-action" type="button">Категории ›</button>
        <div class="card">
          <h2>Партнёр</h2>
          <p id="partner-info"></p>
          <a id="invite-link" hidden>Открыть ссылку</a>
          <button id="copy-invite" type="button" hidden>Скопировать ссылку</button>
        </div>
        <div class="card">
          <h2>Общий чат</h2>
          <p id="group-info"></p>
        </div>
      </section>
      <section id="labels-view" hidden>
        <button id="labels-back" class="quiet back" type="button">‹ К пространству</button>
        <h1>Категории</h1>
        <section class="card">
          <form id="add-category-label" class="quick-add">
            <input id="category-label-name" maxlength="60" placeholder="Новая категория" aria-label="Название категории" required>
            <button type="submit">Добавить</button>
          </form>
          <p id="categories-empty" hidden>Категорий пока нет.</p>
          <ul id="categories-list" class="label-list"></ul>
        </section>
      </section>
    </div>
  </main>
  <dialog id="delete-label-dialog" aria-labelledby="delete-label-title">
    <form method="dialog">
      <h2 id="delete-label-title">Удалить категорию?</h2>
      <p id="delete-label-note"></p>
      <div class="actions">
        <button value="back" autofocus>Назад</button>
        <button class="danger" value="delete">Удалить</button>
      </div>
    </form>
  </dialog>
  <dialog id="category-icon-dialog" aria-labelledby="category-icon-title">
    <h2 id="category-icon-title">Иконка категории</h2>
    <div id="category-icon-options" class="category-icon-grid"></div>
    <form method="dialog"><button class="quiet" type="submit">Закрыть</button></form>
  </dialog>
  <dialog id="complete-parent-dialog" aria-labelledby="complete-parent-title">
    <form method="dialog">
      <h2 id="complete-parent-title">Остались активные подзадачи</h2>
      <p id="complete-parent-note"></p>
      <div class="actions">
        <button value="children" autofocus>К подзадачам</button>
        <button class="primary" value="complete">Завершить всё равно</button>
        <button class="quiet" value="back">Назад</button>
      </div>
    </form>
  </dialog>
  <dialog id="delete-subtask-dialog" aria-labelledby="delete-subtask-title">
    <form method="dialog">
      <h2 id="delete-subtask-title">Удалить подзадачу?</h2>
      <p id="delete-subtask-note"></p>
      <div class="actions">
        <button value="back" autofocus>Назад</button>
        <button class="danger" value="delete">Удалить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
